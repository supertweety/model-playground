name: Verify
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            tests/requirements.txt
      - name: Install isolated test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install -r python/requirements.txt -r tests/requirements.txt
          .venv/bin/python -m pip check
          .venv/bin/python -m playwright install --with-deps chromium webkit
      - name: Prepare locally served runtime
        run: .venv/bin/python scripts/fetch_runtime.py
      - name: Compare Python and browsers; exercise UI
        run: .venv/bin/python tests/verify.py
      - name: Exercise training, prediction and export
        run: .venv/bin/python tests/training_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            artifacts/verification/*.json
            artifacts/verification/*.png
          retention-days: 7
